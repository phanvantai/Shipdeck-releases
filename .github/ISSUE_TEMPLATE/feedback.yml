name: Feedback
description: Something broke, something is missing, or an idea
body:
  - type: dropdown
    id: kind
    attributes:
      label: What is it about?
      options:
        - Something doesn't work
        - Something is missing
        - An idea
        - A question
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, or what would you like?
      description: For a problem, what you did, what you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shipdeck version
      description: Filled in when you use Help › Send Feedback in the app.
      placeholder: 0.6.2 (13)
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Run `claude --version` in Terminal.
